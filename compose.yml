services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_AUDIT_FILE: /var/lib/dujiao-bot/audit.jsonl
    volumes:
      - bot-audit:/var/lib/dujiao-bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "8444:8444"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8444/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bot-audit:
