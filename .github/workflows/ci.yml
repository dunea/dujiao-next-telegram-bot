name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check maintenance script syntax
        run: sh -n scripts/acceptance.sh scripts/package-release.sh scripts/test-upgrade.sh scripts/test-real-upstream.sh scripts/test-telegram-e2e.sh scripts/test-soak.sh

      - name: Vet
        run: |
          go vet ./...
          go vet -tags realdujiao ./integration/realdujiao

      - name: Check offline real-backend release pins
        run: go test -tags realdujiao ./integration/realdujiao -run '^TestReleasePins$' -count=1

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build binary
        run: go build -trimpath -o dist/dujiao-next-telegram-bot ./cmd/bot

      - name: Check offline version command
        run: dist/dujiao-next-telegram-bot --version

      - name: Check offline setup entry point
        run: dist/dujiao-next-telegram-bot setup --help

      - name: Verify real Redis AOF restart recovery
        env:
          BOT_TEST_REDIS_URL: redis://127.0.0.1:16379
        run: |
          docker run --detach --name session-redis --publish 127.0.0.1:16379:6379 --volume session-redis-data:/data redis:7.4-alpine redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
          for attempt in $(seq 1 30); do
            if docker exec session-redis redis-cli ping; then break; fi
            sleep 1
          done
          BOT_TEST_REDIS_PHASE=seed go test ./internal/session -run '^TestRedisAOFRestart$' -count=1
          docker restart session-redis
          for attempt in $(seq 1 30); do
            if docker exec session-redis redis-cli ping; then break; fi
            sleep 1
          done
          BOT_TEST_REDIS_PHASE=verify go test ./internal/session -run '^TestRedisAOFRestart$' -count=1

      - name: Verify v0.4.0 to current storage upgrade and compatible old read
        env:
          BOT_UPGRADE_REDIS_URL: redis://127.0.0.1:16379
        run: sh scripts/test-upgrade.sh

  upstream:
    name: Pinned Dujiao-Next source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Reverify reviewed upstream source fingerprints
        run: go run ./cmd/compatcheck -verify-upstream

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag dujiao-next-telegram-bot:ci .

      - name: Check offline production entry points and non-root user
        run: |
          test "$(docker run --rm --network none dujiao-next-telegram-bot:ci --version)" = "$(sed -n 's/^const version = "\([^"]*\)"/\1/p' cmd/bot/main.go)"
          docker run --rm --network none dujiao-next-telegram-bot:ci setup --help
          test "$(docker run --rm --network none --entrypoint id dujiao-next-telegram-bot:ci -u)" != 0

      - name: Build integration image
        run: docker build --file Dockerfile.integration --tag dujiao-next-telegram-bot-mock:ci .

  release-bundles:
    name: Release bundle validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and validate four clean-source release bundles
        shell: bash
        run: |
          version=$(go run ./cmd/bot --version)
          if [[ "$version" == *-dev ]]; then
            make release-candidate
            bundle_dir="dist/candidates/${version}-${GITHUB_SHA}"
          else
            make release
            bundle_dir="dist/release/v${version}"
          fi
          go run ./cmd/releasecheck -dir "$bundle_dir" > "$bundle_dir/validation.json"
          native="$bundle_dir/dujiao-next-telegram-bot_v${version}_linux_amd64"
          test "$("$native/dujiao-next-telegram-bot" --version)" = "$version"
          "$native/dujiao-next-telegram-bot" setup --help
          "$native/dujiao-compatcheck" -matrix
      - name: Preserve public candidate artifacts only
        uses: actions/upload-artifact@v6
        with:
          name: validated-release-bundles
          path: |
            dist/candidates/*/*.tar.gz
            dist/candidates/*/checksums.txt
            dist/candidates/*/release-manifest.json
            dist/candidates/*/validation.json
            dist/release/*/*.tar.gz
            dist/release/*/checksums.txt
            dist/release/*/release-manifest.json
            dist/release/*/validation.json
          if-no-files-found: error
          retention-days: 14

  real-upstream:
    name: Real Dujiao-Next upgrade and Telegram E2E (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite CLI
        if: matrix.database == 'sqlite'
        run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - name: Run pinned real backends and database upgrade chain
        shell: bash
        env:
          DUJIAO_REAL_DB: ${{ matrix.database }}
        run: sh scripts/test-real-upstream.sh | tee real-upstream-${{ matrix.database }}.log
      - name: Run real Bot process, payment callbacks and Telegram API acceptance
        shell: bash
        env:
          DUJIAO_REAL_DB: ${{ matrix.database }}
        run: sh scripts/test-telegram-e2e.sh | tee telegram-e2e-${{ matrix.database }}.log
      - name: Run bounded sustained load and Telegram fault recovery
        shell: bash
        env:
          DUJIAO_REAL_DB: ${{ matrix.database }}
          DUJIAO_SOAK_DURATION: 90s
        run: sh scripts/test-soak.sh | tee soak-${{ matrix.database }}.log
      - name: Preserve sanitized test result only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-upstream-${{ matrix.database }}
          path: |
            real-upstream-${{ matrix.database }}.log
            telegram-e2e-${{ matrix.database }}.log
            soak-${{ matrix.database }}.log
          if-no-files-found: ignore
          retention-days: 14
          # Never upload temporary configs, databases, dumps or backend logs.
