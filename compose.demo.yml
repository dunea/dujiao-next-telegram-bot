name: dujiao-bot-demo

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - demo-redis-sessions:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15

  demo-store:
    environment:
      DEMO_AFFILIATE_SEED_COMMISSION: "100.00"
    build:
      context: .
      dockerfile: Dockerfile.integration
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  bot:
    build: .
    environment:
      DUJIAO_BASE_URL: http://demo-store:8080
      DUJIAO_CHANNEL_KEY: demo-key
      DUJIAO_CHANNEL_SECRET: demo-secret
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_API_URL: ""
      BOT_HTTP_LISTEN: :8444
      BOT_POLL_TIMEOUT: 30s
      BOT_LOG_LEVEL: info
      BOT_ADMIN_USER_IDS: ${BOT_ADMIN_USER_IDS:-}
      BOT_AUDIT_FILE: /var/lib/dujiao-bot/audit.jsonl
      BOT_REDIS_URL: redis://redis:6379/0
      # DEMO ONLY: never use this public encryption key for a real shop.
      BOT_SESSION_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    ports:
      - "19444:8444"
    volumes:
      - demo-bot-audit:/var/lib/dujiao-bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      redis:
        condition: service_healthy
      demo-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8444/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

volumes:
  demo-redis-sessions:
  demo-bot-audit:
